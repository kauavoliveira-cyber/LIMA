<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <section>
        <h2>Formulário</h2>
        <form action="castro.php" method="post">

            <p><label>Nome: </label></p>
            <input type="text" name="nome" placeholder="Digite seu nome" required>
        </p>

        <p><label>Senha: </label></p>
        <input type="password" name="senha" placeholder="Digite sua senha" required maxlength="8">
        </p>

        <p><label>telefone: </label></p>
        <input type="text" name="telefone" placeholder="Digite seu telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" required
        placeholder="(99) 99999-9999">
        </p>

        <p><label>email: </label></p>
        <input type="email" name="email" placeholder="Digite seu email" required>
        </p>

        <p><label>CEP</label></p>
        <input type="text" name="cep" placeholder="Digite seu CEP" required>
        </p>
        <p><label>Sobre você: </label>
        <textarea name="bio" rows="10" cols="100"></textarea>
        </p>
        <p><label>Genero</label></p>
         <input type="radio" name="genero" value="masculino">Masculino
         <input type="radio" name="genero" value="feminino">Feminino
        </p>
        <p><label>interesses</label></p>
        <input type="checkbox" name="interesses" value="esportes">Esportes
        <input type="checkbox" name="interesses" value="musica">Música
        <input type="checkbox" name="interesses" value="filmes">Filmes
        </p>
        <p><label>Pais: </label></p>
        <select name="pais">
            <option value="">---</option>
            <option value="brasil">Brasil</option>
            <option value="argentina">Argentina</option>
            <option value="chile">Chile</option>
            <option value="uruguai">Uruguai</option>
        </select>
        </p>
        <p><label>Foto de Perfil</label></p>
        <input type="file" name="foto_perfil">
        </p>
        <p><input type="submit" value="Enviar"></p>
        <p><input type="reset" value="Limpar"></p>
        </form>
    </section>
</body>
</html>
